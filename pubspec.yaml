name: hermes
description: Hermes Agent - AI Assistant with Tools, Skills, Memory & Sessions
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  provider: ^6.1.2
  flutter_markdown: ^0.7.2
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/skills/
    - assets/config/