name: hermes
description: Hermes Agent - AI Assistant with Tools, Skills, Memory & Sessions
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  uuid: ^4.4.0
  provider: ^6.1.2
  flutter_markdown: ^0.7.2
  url_launcher: ^6.2.6
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  flutter_secure_storage: ^9.0.0
  connectivity_plus: ^6.0.0
  crypto: ^3.0.3
  dart_openai: ^5.0.0
  collection: ^1.18.0
  equatable: ^2.0.5
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  animations: ^2.0.11
  google_fonts: ^6.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/skills/
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700